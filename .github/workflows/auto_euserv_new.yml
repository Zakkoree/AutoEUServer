name: EUserv Auto Renew

on:
  schedule:
   - cron: '0 8 */7 * *'  # 每7天 UTC 8 点运行 (根据你的时区调整)
  workflow_dispatch:      # 允许手动触发测试
permissions:
  contents: write
jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install selenium requests Pillow
          # 安装 Chrome 和 Chromedriver (GitHub Actions ubuntu-latest 通常自带，但显式安装更稳)
          # sudo apt-get update
          # sudo apt-get install -y chromium-chromedriver

      - name: Run Renewal Script
        env:
          EUSERV_USERNAME: ${{ secrets.EUSERV_USERNAME }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          MAILPARSER_DOWNLOAD_URL_ID: ${{ secrets.MAILPARSER_DOWNLOAD_URL_ID }}
          YESCAPTCHA_KEY: ${{ secrets.YESCAPTCHA_KEY }}
        run: |
          echo "🚀 Starting EUserv Renewal..."
          
          # 1. 配置 Git 用户
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 2. 设置远程仓库地址 (使用 token 认证)
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          
          # 3. 拉取最新代码 (防止冲突)
          git pull --rebase
          
          # 4. 执行保活
          python Github_Action_new.py 
          
          # 5. 创建空提交 (保活工作流)
          # 如果没有任何变化，--allow-empty 确保依然生成一个 commit
          git commit --allow-empty -m "chore: auto keep-alive $(date '+%Y-%m-%d %H:%M:%S')"
          
          # 6. 推送代码
          git push
